name: Publish to WinGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target package version (e.g. 1.3.1, leave empty for current package.json version)'
        required: false
        type: string
        default: ''
      tag:
        description: 'GitHub Release tag to target (e.g. v1.3.1, leave empty to derive from version)'
        required: false
        type: string
        default: ''
      installer_pattern:
        description: 'Glob pattern matching Windows installer asset in GitHub Release'
        required: false
        type: string
        default: '*x64-setup.exe'
      dry_run:
        description: 'Dry run: generate manifests, download installer, verify hash & schema without submitting PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  winget-publish:
    name: WinGet Package Publish
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Version & Tag
        id: resolve
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" | ConvertFrom-Json
          $ver = "${{ github.event.inputs.version }}".Trim()
          if (-not $ver) {
            $ver = $pkg.version
          }
          $ver = $ver -replace '^v', ''

          $tag = "${{ github.event.inputs.tag }}".Trim()
          if (-not $tag) {
            $tag = "v$ver"
          }

          Write-Host "Resolved Version: $ver"
          Write-Host "Resolved Release Tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Verify GitHub Release & Download Installer
        id: verify_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          Write-Host "Checking GitHub release $tag..."
          gh release view $tag

          $pattern = "${{ github.event.inputs.installer_pattern }}"
          if (-not $pattern) {
            $pattern = "*x64-setup.exe"
          }

          # Download Windows NSIS installer asset
          New-Item -ItemType Directory -Force -Path "temp_installer" | Out-Null
          gh release download $tag -D "temp_installer" -p "$pattern"

          $installerFile = Get-ChildItem -Path "temp_installer" -File | Select-Object -First 1
          if (-not $installerFile) {
            Write-Error "No installer asset matching pattern '$pattern' found in release $tag!"
            exit 1
          }

          Write-Host "Found installer asset: $($installerFile.FullName)"
          $hash = (Get-FileHash -Path $installerFile.FullName -Algorithm SHA256).Hash.ToUpper()
          Write-Host "Calculated SHA256: $hash"
          "installer_path=$($installerFile.FullName)" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Generate WinGet Manifests
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve.outputs.version }}"
          $hash = "${{ steps.verify_release.outputs.installer_sha256 }}"
          node scripts/generate-winget-manifest.mjs --version $ver --sha256 $hash

      - name: Validate WinGet Manifests
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve.outputs.version }}"
          $manifestDir = "winget/manifests/h/HELIXOrigin/SteamVault/$ver"
          Write-Host "Validating manifests in $manifestDir using Windows Package Manager..."
          winget validate --manifest $manifestDir
          Write-Host "Manifest validation passed successfully!"

      - name: Submit Package to WinGet Repository
        if: ${{ !github.event.inputs.dry_run }}
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.resolve.outputs.version }}"
          $manifestDir = "winget/manifests/h/HELIXOrigin/SteamVault/$ver"

          # Download official Microsoft wingetcreate tool
          $url = "https://github.com/microsoft/winget-create/releases/latest/download/windows-x64-wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile "wingetcreate.exe"

          Write-Host "Submitting package $ver via wingetcreate submit..."
          .\wingetcreate.exe submit -p "Update: HELIXOrigin.SteamVault to $ver" --token $env:WINGET_PAT -n $manifestDir
