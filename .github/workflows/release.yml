name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri installer bundles and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: 'Steam Vault v__VERSION__'
          releaseBody: |
            ## Steam Vault v__VERSION__

            Cross-platform desktop Steam library organizer and manager built with Tauri v2.

            ### Prebuilt Packages
            - **Windows**: `.msi` and `.exe` (NSIS installer)
            - **macOS**: `.dmg` (Universal binary for Apple Silicon & Intel)
            - **Linux**: `.deb` and `.AppImage`

            See [CHANGELOG.md](https://github.com/HELIX-Origin/Steam-Vault/blob/main/CHANGELOG.md) for full release details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
