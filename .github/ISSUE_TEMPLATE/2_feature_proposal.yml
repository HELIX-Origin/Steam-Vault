name: "💡 Feature Proposal"
description: "Suggest an idea or enhancement for Steam Vault"
title: "💡 [Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea for **Steam Vault**!
        Please search existing issues before submitting to avoid duplicates.
  - type: dropdown
    id: category
    attributes:
      label: "Feature Category"
      description: "Which area does this proposal relate to?"
      options:
        - "Library & Organization"
        - "Smart Collections & Rules"
        - "Artwork Management"
        - "Storage & Multi-Drive Moving"
        - "Non-Steam Platforms & Emulators"
        - "Metadata Providers"
        - "Localization & i18n"
        - "User Experience & UI Theme"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem or Need"
      description: "Is your feature request related to a problem or limitation? Please describe."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions"
      description: "Describe any alternative solutions or features you've considered."
