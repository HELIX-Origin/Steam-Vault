name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in Steam Vault (UI, Steam discovery, collections, storage, non-Steam scan)"
title: "🐛 [Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with **Steam Vault**!
        Please search existing issues before submitting to avoid duplicates.
  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      description: "Select the subsystem where the problem occurs."
      options:
        - "Steam Discovery & Account Detection"
        - "Library View & Owned Games Sync"
        - "Collections & Cloud Storage Namespace"
        - "Filter Builder & Smart Collections"
        - "AutoCats / Auto-categorization"
        - "Non-Steam Launchers & Platforms (GOG, Epic, itch, etc.)"
        - "Emulators & ROM Detection"
        - "Storage Manager & Library Folders"
        - "Artwork Manager & SteamGridDB"
        - "Metadata Providers (VNDB, Steam Store, PCGamingWiki)"
        - "SQLite Metadata Cache"
        - "i18n Localization / Language Selection"
        - "Window Titlebar & UI Glassmorphism"
        - "Other / Unsure"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which operating system are you running?"
      options:
        - "Windows 11 (x86_64)"
        - "Windows 10 (x86_64)"
        - "Linux - Ubuntu / Debian (x86_64 / arm64)"
        - "Linux - Fedora / RHEL (x86_64)"
        - "Linux - Arch / SteamOS (x86_64)"
        - "macOS - Apple Silicon (M1/M2/M3/M4)"
        - "macOS - Intel (x86_64)"
        - "Other"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "Steam Vault Version"
      description: "Check the version in Settings or application titlebar."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When attempting to..."
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to Reproduce"
      description: "Numbered steps to reproduce the behavior."
      value: |
        1. Open Steam Vault
        2. Navigate to '....'
        3. Perform '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: "The games should be categorized into..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Log Output or Error Messages"
      description: "Paste any relevant console messages or log output from the app."
      render: shell
