<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sideBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#190733"/>
      <stop offset="45%" stop-color="#120426"/>
      <stop offset="85%" stop-color="#090214"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="sideGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#6b21a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Controller Body Gradient -->
    <linearGradient id="sideCtrlBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a0f4c"/>
      <stop offset="40%" stop-color="#1a0733"/>
      <stop offset="80%" stop-color="#120424"/>
      <stop offset="100%" stop-color="#0a0214"/>
    </linearGradient>

    <!-- Thumbstick Glow -->
    <radialGradient id="sideStickGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#130426" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- 1. Background -->
  <rect width="164" height="314" fill="url(#sideBg)"/>

  <!-- 2. Cyber Circuit Lines -->
  <g opacity="0.25">
    <path d="M0 60 h40 l20 20 h104" stroke="#a855f7" stroke-width="1" fill="none"/>
    <path d="M164 220 h-40 l-20 -20 h-104" stroke="#c084fc" stroke-width="1" fill="none"/>
    <path d="M20 0 v50 l15 15 v120 l-15 15 v114" stroke="#38bdf8" stroke-width="1" fill="none"/>
    <path d="M144 0 v80 l-15 15 v100 l15 15 v104" stroke="#e879f9" stroke-width="1" fill="none"/>
    <circle cx="60" cy="80" r="2.5" fill="#e879f9"/>
    <circle cx="104" cy="200" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- 3. Ambient Glow -->
  <circle cx="82" cy="125" r="75" fill="url(#sideGlow)"/>

  <!-- 4. Top Branding Tag -->
  <g transform="translate(82, 38)">
    <text text-anchor="middle" fill="#c084fc" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="3">HELIX ORIGIN</text>
  </g>

  <!-- 5. Centered Dark Futuristic Purple Controller -->
  <g transform="translate(13, 62) scale(0.395)">
    <!-- Outer Glow -->
    <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
          fill="none" stroke="#c084fc" stroke-width="8" stroke-opacity="0.45" stroke-linejoin="round"/>

    <!-- Controller Body -->
    <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
          fill="url(#sideCtrlBody)" stroke="#a855f7" stroke-width="4" stroke-linejoin="round"/>

    <!-- Lightbar Strip -->
    <path d="M110 36 C130 28 155 25 175 25 C195 25 220 28 240 36" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M125 48 C142 42 160 39 175 39 C190 39 208 42 225 48" fill="none" stroke="#e879f9" stroke-width="3" stroke-linecap="round"/>

    <!-- Grips -->
    <path d="M68 115 C78 150 92 195 105 235" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M282 115 C272 150 258 195 245 235" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Center Screen -->
    <rect x="145" y="60" width="60" height="42" rx="8" fill="#1b0833" stroke="#c084fc" stroke-width="2"/>
    <polygon points="175,68 186,81 175,94 164,81" fill="#e879f9"/>
    <circle cx="175" cy="81" r="4" fill="#ffffff"/>

    <!-- Left D-Pad -->
    <g transform="translate(105, 115)">
      <path d="M-8 -22 h16 v14 h14 v16 h-14 v14 h-16 v-14 h-14 v-16 h14 Z" fill="#250d45" stroke="#a855f7" stroke-width="2.5"/>
      <polygon points="0,-16 -4,-10 4,-10" fill="#c084fc"/>
      <polygon points="0,16 -4,10 4,10" fill="#c084fc"/>
      <polygon points="-16,0 -10,-4 -10,4" fill="#c084fc"/>
      <polygon points="16,0 10,-4 10,4" fill="#c084fc"/>
    </g>

    <!-- Right Action Diamond -->
    <g transform="translate(245, 115)">
      <circle cx="0" cy="-18" r="9" fill="#250d45" stroke="#e879f9" stroke-width="2"/>
      <circle cx="0" cy="-18" r="4" fill="#e879f9"/>
      <circle cx="-18" cy="0" r="9" fill="#250d45" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-18" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="18" cy="0" r="9" fill="#250d45" stroke="#c084fc" stroke-width="2"/>
      <circle cx="18" cy="0" r="4" fill="#c084fc"/>
      <circle cx="0" cy="18" r="9" fill="#250d45" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="18" r="4" fill="#34d399"/>
    </g>

    <!-- Analog Sticks -->
    <g transform="translate(140, 168)">
      <circle cx="0" cy="0" r="24" fill="#0d031a" stroke="#7e22ce" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#sideStickGlow)" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#230a40" stroke="#c084fc" stroke-width="1.2"/>
    </g>

    <g transform="translate(210, 168)">
      <circle cx="0" cy="0" r="24" fill="#0d031a" stroke="#7e22ce" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="url(#sideStickGlow)" stroke="#c084fc" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#230a40" stroke="#e879f9" stroke-width="1.2"/>
    </g>
  </g>

  <!-- 6. Divider Line -->
  <line x1="24" y1="200" x2="140" y2="200" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 7. Bottom Branding Text -->
  <g transform="translate(82, 226)">
    <text text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">UNIVERSAL</text>
    <text y="18" text-anchor="middle" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="1">GAME LAUNCHER</text>
  </g>

  <!-- 8. Feature Tags -->
  <g transform="translate(82, 275)" opacity="0.8">
    <text text-anchor="middle" fill="#c084fc" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="1">ALL STOREFRONTS</text>
    <text y="14" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" letter-spacing="1">DIRECT LAUNCH</text>
  </g>
</svg>
