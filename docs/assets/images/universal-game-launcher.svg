<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Universal Game Launcher</title>
  <desc id="description">Dark futuristic purple game controller on a futuristic dark purple background with neon glow accents.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e041d"/>
      <stop offset="50%" stop-color="#140628"/>
      <stop offset="100%" stop-color="#07020e"/>
    </linearGradient>

    <!-- Futuristic Circuit Glow -->
    <linearGradient id="circuitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Controller Body Gradients -->
    <linearGradient id="controllerBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a0f4c"/>
      <stop offset="35%" stop-color="#1a0733"/>
      <stop offset="70%" stop-color="#120424"/>
      <stop offset="100%" stop-color="#0a0214"/>
    </linearGradient>

    <linearGradient id="gripHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="thumbstickGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#120424" stop-opacity="0.9"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Plate Clip Path (Standard 450x450 at 218, 315 with 72px radius) -->
    <clipPath id="icon">
      <rect x="218" y="315" width="450" height="450" rx="72"/>
    </clipPath>
  </defs>

  <!-- 1. Full Canvas Background -->
  <rect width="1920" height="1080" fill="url(#background)"/>

  <!-- 2. Futuristic Circuit Grid & Cyber Traces -->
  <g opacity="0.18">
    <path d="M0 240 h600 l120 120 h400 l80 -80 h720" stroke="#a855f7" stroke-width="2" fill="none"/>
    <path d="M200 1080 v-280 l140 -140 h500 l100 100 v320" stroke="#c084fc" stroke-width="2" fill="none"/>
    <path d="M800 0 v200 l-80 80 v300 l120 120 h800" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M1100 480 l80 80 h400 l60 -60 v-300" stroke="#e879f9" stroke-width="1.5" fill="none"/>
    <!-- Circuit Nodes -->
    <circle cx="720" cy="360" r="5" fill="#e879f9"/>
    <circle cx="1120" cy="280" r="5" fill="#38bdf8"/>
    <circle cx="840" cy="660" r="5" fill="#c084fc"/>
    <circle cx="1580" cy="560" r="5" fill="#a855f7"/>
  </g>

  <!-- 3. Atmospheric Ambient Glowing Orbs -->
  <circle cx="1680" cy="180" r="550" fill="#a855f7" opacity="0.14"/>
  <circle cx="1380" cy="880" r="460" fill="#7e22ce" opacity="0.12"/>
  <circle cx="440" cy="540" r="380" fill="#9333ea" opacity="0.15"/>
  <circle cx="150" cy="200" r="300" fill="#38bdf8" opacity="0.06"/>

  <!-- 4. Signature Diagonal Light Ray -->
  <path d="M0 930 750 180h360L360 1080H0z" fill="#fff" opacity="0.02"/>

  <!-- 5. Soft Outer Glow Behind Icon Plate -->
  <rect x="198" y="295" width="490" height="490" rx="92" fill="#a855f7" opacity="0.12"/>
  <rect x="208" y="305" width="470" height="470" rx="82" fill="#c084fc" opacity="0.08"/>

  <!-- 6. Icon Plate Container -->
  <g clip-path="url(#icon)">
    <!-- Plate Background Base (Futuristic Dark Purple) -->
    <rect x="218" y="315" width="450" height="450" fill="#110524"/>

    <!-- Subtle Circuit / Carbon Texture inside Plate -->
    <path d="M220 380 h450 M220 440 h450 M220 500 h450 M220 560 h450 M220 620 h450 M220 680 h450" stroke="#7e22ce" stroke-width="1" stroke-opacity="0.12"/>
    <path d="M280 315 v450 M340 315 v450 M400 315 v450 M460 315 v450 M520 315 v450 M580 315 v450 M640 315 v450" stroke="#7e22ce" stroke-width="1" stroke-opacity="0.12"/>

    <!-- Ambient Glow inside Plate -->
    <circle cx="443" cy="540" r="180" fill="#a855f7" opacity="0.25"/>
    <circle cx="340" cy="460" r="120" fill="#38bdf8" opacity="0.15"/>
    <circle cx="550" cy="620" r="130" fill="#e879f9" opacity="0.18"/>

    <!-- Futuristic Dark Purple Game Controller -->
    <g transform="translate(268, 385)">
      <!-- Outer Neon Edge Glow Filter / Silhouette -->
      <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
            fill="none" stroke="#c084fc" stroke-width="5" stroke-opacity="0.4" stroke-linejoin="round"/>

      <!-- Controller Main Body -->
      <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
            fill="url(#controllerBody)" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Top Shoulder Plate & Lightbar Trims -->
      <path d="M110 38 C130 30 155 27 175 27 C195 27 220 30 240 38" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9"/>
      <path d="M125 48 C142 42 160 39 175 39 C190 39 208 42 225 48" fill="none" stroke="#e879f9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

      <!-- Left & Right Ergonomic Grip Bevel Lines -->
      <path d="M68 115 C78 150 92 195 105 235" fill="none" stroke="url(#gripHighlight)" stroke-width="3" stroke-linecap="round"/>
      <path d="M282 115 C272 150 258 195 245 235" fill="none" stroke="url(#gripHighlight)" stroke-width="3" stroke-linecap="round"/>

      <!-- Center Nexus / Touchpad with Glowing Logo -->
      <rect x="145" y="60" width="60" height="42" rx="8" fill="#17062e" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7"/>
      <polygon points="175,70 185,82 175,94 165,82" fill="url(#centerGlow)"/>
      <circle cx="175" cy="82" r="3.5" fill="#ffffff"/>

      <!-- Left Directional D-Pad (Cyber Angular Cross) -->
      <g transform="translate(105, 115)">
        <path d="M-7 -22 h14 v15 h15 v14 h-15 v15 h-14 v-15 h-15 v-14 h15 Z" fill="#200a3b" stroke="#a855f7" stroke-width="2" stroke-linejoin="miter"/>
        <!-- D-Pad Directional Triangles -->
        <polygon points="0,-18 -4,-12 4,-12" fill="#c084fc"/>
        <polygon points="0,18 -4,12 4,12" fill="#c084fc"/>
        <polygon points="-18,0 -12,-4 -12,4" fill="#c084fc"/>
        <polygon points="18,0 12,-4 12,4" fill="#c084fc"/>
      </g>

      <!-- Right Action Diamond Buttons (X, Y, A, B) -->
      <g transform="translate(245, 115)">
        <!-- Top Button (Y) -->
        <circle cx="0" cy="-18" r="7.5" fill="#1b0833" stroke="#e879f9" stroke-width="1.8"/>
        <circle cx="0" cy="-18" r="3" fill="#e879f9"/>
        <!-- Left Button (X) -->
        <circle cx="-18" cy="0" r="7.5" fill="#1b0833" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="-18" cy="0" r="3" fill="#38bdf8"/>
        <!-- Right Button (B) -->
        <circle cx="18" cy="0" r="7.5" fill="#1b0833" stroke="#c084fc" stroke-width="1.8"/>
        <circle cx="18" cy="0" r="3" fill="#c084fc"/>
        <!-- Bottom Button (A) -->
        <circle cx="0" cy="18" r="7.5" fill="#1b0833" stroke="#34d399" stroke-width="1.8"/>
        <circle cx="0" cy="18" r="3" fill="#34d399"/>
      </g>

      <!-- Left Analog Thumbstick -->
      <g transform="translate(140, 168)">
        <circle cx="0" cy="0" r="22" fill="#0d031a" stroke="#7e22ce" stroke-width="2"/>
        <circle cx="0" cy="0" r="17" fill="url(#thumbstickGlow)" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#1f0a38" stroke="#c084fc" stroke-width="1"/>
      </g>

      <!-- Right Analog Thumbstick -->
      <g transform="translate(210, 168)">
        <circle cx="0" cy="0" r="22" fill="#0d031a" stroke="#7e22ce" stroke-width="2"/>
        <circle cx="0" cy="0" r="17" fill="url(#thumbstickGlow)" stroke="#c084fc" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="8" fill="#1f0a38" stroke="#e879f9" stroke-width="1"/>
      </g>

      <!-- Subtle Cyber Accent Chevrons -->
      <path d="M165 125 l10 8 l10 -8" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 7. Outer Border Outline for Icon Plate -->
  <rect x="218" y="315" width="450" height="450" rx="72" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="3"/>

  <!-- 8. Vertical Brand Accent Divider Bar -->
  <rect x="820" y="376" width="10" height="328" rx="5" fill="url(#accent)"/>

  <!-- 9. Typography Block -->
  <!-- Primary Title -->
  <text x="880" y="475" fill="#fdf4ff" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" letter-spacing="-1">Universal Game Launcher</text>

  <!-- Subtitle / Tagline -->
  <text x="880" y="565" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="500">Universal Game Library &amp; High-Performance Launcher</text>

  <!-- Category Tracking Badge -->
  <text x="885" y="650" fill="#c084fc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="8">MULTI-STOREFRONT LAUNCHER</text>
</svg>
