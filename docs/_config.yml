# ==============================================================================
# Universal Game Launcher - Jekyll Documentation Site Configuration
# ==============================================================================

title: Universal Game Launcher
tagline: Universal Game Launcher & Library Hub
tagline_short: Universal Game Launcher
description: "A fast, lightweight, privacy-first universal game launcher and library organizer across Steam, Epic, GOG, Xbox, EA, Ubisoft, and local games."
url: "https://helix-origin.github.io"
baseurl: "/Steam-Vault"
repository: "HELIX-Origin/Steam-Vault"
github_username: "HELIX-Origin"
logo: "assets/images/logo.svg"
favicon: "assets/images/favicon.ico"
header_image: "assets/images/universal-game-launcher.svg"
image: "assets/images/universal-game-launcher.svg"

author:
  name: "HELIX Origin"
  url: "https://helix-origin.github.io"

# Remote Theme Configuration
remote_theme: HELIX-Origin/helix-docs

encoding: "utf-8"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  parse_block_html: true
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

optional_front_matter:
  remove_originals: true

# Jekyll Collections Registration
collections:
  docs:
    output: true
    permalink: /docs/:path/
  wiki:
    output: true
    permalink: /wiki/:path/

# Build Inclusions & Exclusions
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - tools
  - .github
  - .vscode
  - "*.ps1"
  - "*.bat"
  - "*.py"
  - "*.yml.bak"
  - "*.tmp"

include:
  - assets

# Frontmatter Cascade Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      comments: false
      nav_order: 9999

  - scope:
      path: "index.md"
    values:
      layout: default
      page_class: page--home

  - scope:
      path: ""
      type: docs
    values:
      layout: docs
      page_class: page--doc
      section: docs

  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
      page_class: page--wiki
      section: wiki
