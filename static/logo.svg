<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Universal Game Launcher logo">
  <defs>
    <!-- Squircle Clip -->
    <clipPath id="squircle">
      <rect x="8" y="8" width="240" height="240" rx="56" />
    </clipPath>

    <!-- Logo Background Gradient -->
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190733"/>
      <stop offset="60%" stop-color="#0f0321"/>
      <stop offset="100%" stop-color="#070110"/>
    </linearGradient>

    <!-- Controller Body Gradient -->
    <linearGradient id="ctrlBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#311259"/>
      <stop offset="45%" stop-color="#1f093d"/>
      <stop offset="100%" stop-color="#0d031c"/>
    </linearGradient>

    <!-- Radial Glow Behind Controller -->
    <radialGradient id="ctrlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#6b21a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Thumbstick Glow -->
    <radialGradient id="stickGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#130426" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#logoBg)"/>

  <!-- Inside Squircle Content -->
  <g clip-path="url(#squircle)">
    <!-- Circuit grid lines -->
    <path d="M8 80 h240 M8 176 h240 M80 8 v240 M176 8 v240" stroke="#7e22ce" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="128" cy="128" r="90" fill="url(#ctrlGlow)"/>

    <!-- Scaled Dark Futuristic Purple Game Controller -->
    <g transform="translate(40, 48) scale(0.49)">
      <!-- Outer Glow Silhouette -->
      <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
            fill="none" stroke="#c084fc" stroke-width="8" stroke-opacity="0.5" stroke-linejoin="round"/>

      <!-- Main Controller Body -->
      <path d="M85 70 C105 32 155 25 175 25 C195 25 245 32 265 70 C285 105 325 210 305 255 C290 288 245 285 220 230 C205 195 185 185 175 185 C165 185 145 195 130 230 C105 285 60 288 45 255 C25 210 65 105 85 70 Z"
            fill="url(#ctrlBody)" stroke="#a855f7" stroke-width="4" stroke-linejoin="round"/>

      <!-- Lightbar Neon Strip -->
      <path d="M110 36 C130 28 155 25 175 25 C195 25 220 28 240 36" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
      <path d="M125 48 C142 42 160 39 175 39 C190 39 208 42 225 48" fill="none" stroke="#e879f9" stroke-width="4" stroke-linecap="round"/>

      <!-- Grip Accent Highlights -->
      <path d="M68 115 C78 150 92 195 105 235" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
      <path d="M282 115 C272 150 258 195 245 235" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>

      <!-- Center Nexus Screen -->
      <rect x="145" y="60" width="60" height="42" rx="8" fill="#1b0833" stroke="#c084fc" stroke-width="2.5"/>
      <polygon points="175,68 186,81 175,94 164,81" fill="#e879f9"/>
      <circle cx="175" cy="81" r="4.5" fill="#ffffff"/>

      <!-- Left D-Pad -->
      <g transform="translate(105, 115)">
        <path d="M-9 -24 h18 v15 h15 v18 h-15 v15 h-18 v-15 h-15 v-18 h15 Z" fill="#250d45" stroke="#a855f7" stroke-width="3"/>
        <polygon points="0,-18 -5,-11 5,-11" fill="#c084fc"/>
        <polygon points="0,18 -5,11 5,11" fill="#c084fc"/>
        <polygon points="-18,0 -11,-5 -11,5" fill="#c084fc"/>
        <polygon points="18,0 11,-5 11,5" fill="#c084fc"/>
      </g>

      <!-- Right Action Diamond -->
      <g transform="translate(245, 115)">
        <circle cx="0" cy="-20" r="10" fill="#250d45" stroke="#e879f9" stroke-width="2.5"/>
        <circle cx="0" cy="-20" r="4.5" fill="#e879f9"/>
        <circle cx="-20" cy="0" r="10" fill="#250d45" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="-20" cy="0" r="4.5" fill="#38bdf8"/>
        <circle cx="20" cy="0" r="10" fill="#250d45" stroke="#c084fc" stroke-width="2.5"/>
        <circle cx="20" cy="0" r="4.5" fill="#c084fc"/>
        <circle cx="0" cy="20" r="10" fill="#250d45" stroke="#34d399" stroke-width="2.5"/>
        <circle cx="0" cy="20" r="4.5" fill="#34d399"/>
      </g>

      <!-- Analog Sticks -->
      <g transform="translate(140, 168)">
        <circle cx="0" cy="0" r="26" fill="#0d031a" stroke="#7e22ce" stroke-width="3"/>
        <circle cx="0" cy="0" r="20" fill="url(#stickGlow)" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="10" fill="#230a40" stroke="#c084fc" stroke-width="1.5"/>
      </g>

      <g transform="translate(210, 168)">
        <circle cx="0" cy="0" r="26" fill="#0d031a" stroke="#7e22ce" stroke-width="3"/>
        <circle cx="0" cy="0" r="20" fill="url(#stickGlow)" stroke="#c084fc" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="10" fill="#230a40" stroke="#e879f9" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Outer Neon Rim -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-opacity="0.8"/>
</svg>
