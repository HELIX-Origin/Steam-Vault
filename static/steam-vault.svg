<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Steam Vault</title>
  <desc id="description">Steam Vault library organizer and manager icon with matching title on a dark obsidian background.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#040a14"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Steam Logo Radial Gradient -->
    <linearGradient id="steamGradient" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111d2e" offset="0%"/>
      <stop stop-color="#051839" offset="21.2%"/>
      <stop stop-color="#0a1b48" offset="40.7%"/>
      <stop stop-color="#132e62" offset="58.1%"/>
      <stop stop-color="#144b7e" offset="73.8%"/>
      <stop stop-color="#136497" offset="87.3%"/>
      <stop stop-color="#1387b8" offset="100%"/>
    </linearGradient>

    <!-- Icon Plate Clip Path (Standard 450x450 at 218, 315 with 72px radius) -->
    <clipPath id="icon">
      <rect x="218" y="315" width="450" height="450" rx="72"/>
    </clipPath>
  </defs>

  <!-- 1. Full Canvas Background -->
  <rect width="1920" height="1080" fill="url(#background)"/>

  <!-- 2. Atmospheric Ambient Orbs -->
  <circle cx="1700" cy="150" r="540" fill="#38bdf8" opacity=".10"/>
  <circle cx="1400" cy="900" r="420" fill="#a855f7" opacity=".08"/>

  <!-- 3. Signature Diagonal Light Ray -->
  <path d="M0 930 750 180h360L360 1080H0z" fill="#fff" opacity=".025"/>

  <!-- 4. Soft Outer Glow Behind Icon Plate -->
  <rect x="198" y="295" width="490" height="490" rx="92" fill="#fff" opacity=".08"/>

  <!-- 5. Icon Plate Vector Artwork Container -->
  <g clip-path="url(#icon)">
    <!-- Plate Background Base -->
    <rect x="218" y="315" width="450" height="450" fill="#091528"/>

    <!-- Internal Ambient Glows -->
    <circle cx="619" cy="343" r="160" fill="#38bdf8" opacity=".14"/>
    <circle cx="260" cy="740" r="140" fill="#a855f7" opacity=".12"/>

    <!-- Steam Vault Branding Graphic inside Icon Plate -->
    <g transform="translate(293, 390) scale(4.6)">
      <!-- Outer Steam Circle -->
      <path d="M1.305 41.202C5.259 54.386 17.488 64 31.959 64c17.673 0 32-14.327 32-32s-14.327-32-32-32C15.001 0 1.124 13.193.028 29.874c2.074 3.477 2.879 5.628 1.275 11.328z" fill="url(#steamGradient)" />
      <!-- Mechanical Vault Arm & Pinion -->
      <path d="M30.31 23.985l.003.158-7.83 11.375c-1.268-.058-2.54.165-3.748.662a8.14 8.14 0 0 0-1.498.8L.042 29.893s-.398 6.546 1.26 11.424l12.156 5.016c.6 2.728 2.48 5.12 5.242 6.27a8.88 8.88 0 0 0 11.603-4.782 8.89 8.89 0 0 0 .684-3.656L42.18 36.16l.275.005c6.705 0 12.155-5.466 12.155-12.18s-5.44-12.16-12.155-12.174c-6.702 0-12.155 5.46-12.155 12.174zm-1.88 23.05c-1.454 3.5-5.466 5.147-8.953 3.694a6.84 6.84 0 0 1-3.524-3.362l3.957 1.64a5.04 5.04 0 0 0 6.591-2.719 5.05 5.05 0 0 0-2.715-6.601l-4.1-1.695c1.578-.6 3.372-.62 5.05.077 1.7.703 3 2.027 3.696 3.72s.692 3.56-.01 5.246M42.466 32.1a8.12 8.12 0 0 1-8.098-8.113 8.12 8.12 0 0 1 8.098-8.111 8.12 8.12 0 0 1 8.1 8.111 8.12 8.12 0 0 1-8.1 8.113m-6.068-8.126a6.09 6.09 0 0 1 6.08-6.095c3.355 0 6.084 2.73 6.084 6.095a6.09 6.09 0 0 1-6.084 6.093 6.09 6.09 0 0 1-6.081-6.093z" fill="#ffffff" />
    </g>
  </g>

  <!-- 6. Outer Border Outline for Icon Plate -->
  <rect x="218" y="315" width="450" height="450" rx="72" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="3"/>

  <!-- 7. Vertical Brand Accent Divider Bar -->
  <rect x="820" y="376" width="10" height="328" rx="5" fill="url(#accent)"/>

  <!-- 8. Typography Block -->
  <!-- Primary Title (H1) -->
  <text x="880" y="485" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="92" font-weight="700">Steam Vault</text>

  <!-- Subtitle / Tagline (H2) -->
  <text x="880" y="585" fill="#dfeafa" font-family="Arial, sans-serif" font-size="54" font-weight="600">Library Organizer &amp; Manager</text>

  <!-- Category Tracking Badge -->
  <text x="885" y="660" fill="#38bdf8" font-family="Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="8">DESKTOP STEAM SUITE</text>
</svg>
